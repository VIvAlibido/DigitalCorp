name: AI Bulletin — dagelijkse editie

on:
  schedule:
    # Elke dag — beslissing 2 legt zeven dagen per week vast.
    # 05:15 UTC = 07:15 in de zomer, 06:15 in de winter.
    # GitHub Actions kent alleen UTC; de wintertijd-afwijking is bewust
    # geaccepteerd. Wil je exact 07:00 lokaal, plan dan twee cron-regels
    # en laat het script zelf de Europe/Amsterdam-tijd controleren.
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      heuristisch:
        description: "Sla de LLM-jury over (goedkope testrun)"
        type: boolean
        default: false

defaults:
  run:
    working-directory: ai-bulletin

jobs:
  editie:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-bulletin/requirements.txt

      - name: Installeer dependencies
        run: pip install -r requirements.txt

      - name: Draai tests
        run: python -m unittest discover -s tests

      - name: Stel de editie samen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optioneel: verhoogt de GitHub-zoeklimiet van 10 naar 30 req/min.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          python -m signaal.cli \
            ${{ inputs.heuristisch && '--heuristisch' || '' }} \
            --verbose

      # Proefbouw. Vercel bouwt de site die de lezer ziet; deze stap laat de
      # workflow falen als de generator struikelt, vóórdat de editie wordt
      # vastgelegd en Vercel er alsnog mee aan de haal gaat.
      - name: Bouw de website (proef)
        run: python -m signaal.cli --site

      # Vóór de publicatiepoort, en met if: always(). Faalt de poort — of de
      # editie zelf — dan is het samenstellen al gebeurd en wil je juist zien
      # wát er gemaakt is. Stond deze stap erachter, dan gooide een rode run
      # het resultaat weg en hield je alleen logregels over.
      - name: Archiveer de editie
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editie-${{ github.run_id }}
          path: ai-bulletin/edities/
          retention-days: 90
          if-no-files-found: warn

      # Een nieuwssite die op betrouwbaarheid concurreert kan niet anoniem zijn,
      # en art. 3:15d BW verplicht een commerciële site tot naam, adres, e-mail
      # en KvK-nummer. Liever hier falen dan het ontdekken via een lezer.
      - name: Controleer of publiceren mag
        run: |
          python - <<'PY'
          import sys
          from signaal import pipeline, site
          blokkades = site.controleer_publicatiegereed(pipeline.laad_config("config.yaml"))
          for regel in blokkades:
              print(f"::error::{regel}")
          sys.exit(1 if blokkades else 0)
          PY

      # Dit is tevens de publicatiestap. Vercel is aan deze repo gekoppeld
      # (beslissing 11) en bouwt bij elke push opnieuw via vercel.json.
      # Er is dus bewust geen deploy-stap in deze workflow: die zou een tweede
      # versie van de site opleveren op een tweede adres.
      - name: Bewaar het archief in de repo — hiermee publiceert Vercel
        run: |
          git config user.name "AI Bulletin"
          git config user.email "noreply@aibulletin.nl"
          git add edities
          git diff --cached --quiet && exit 0
          git commit -m "Editie van $(date -u +%F)"
          git push
