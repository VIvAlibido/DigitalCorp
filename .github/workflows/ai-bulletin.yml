name: AI Bulletin — dagelijkse editie

on:
  schedule:
    # 05:15 UTC = 07:15 in de zomer, 06:15 in de winter.
    # GitHub Actions kent alleen UTC; de wintertijd-afwijking is bewust
    # geaccepteerd. Wil je exact 07:00 lokaal, plan dan twee cron-regels
    # en laat het script zelf de Europe/Amsterdam-tijd controleren.
    - cron: "15 5 * * 1-5"
  workflow_dispatch:
    inputs:
      heuristisch:
        description: "Sla de LLM-jury over (goedkope testrun)"
        type: boolean
        default: false

defaults:
  run:
    working-directory: ai-bulletin

jobs:
  editie:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-bulletin/requirements.txt

      - name: Installeer dependencies
        run: pip install -r requirements.txt

      - name: Draai tests
        run: python -m unittest discover -s tests

      - name: Stel de editie samen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optioneel: verhoogt de GitHub-zoeklimiet van 10 naar 30 req/min.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          python -m signaal.cli \
            ${{ inputs.heuristisch && '--heuristisch' || '' }} \
            --verbose

      - name: Bouw de website
        run: python -m signaal.cli --site

      # Een nieuwssite die op betrouwbaarheid concurreert kan niet anoniem zijn,
      # en art. 3:15d BW verplicht een commerciële site tot naam, adres, e-mail
      # en KvK-nummer. Liever hier falen dan het ontdekken via een lezer.
      - name: Controleer of publiceren mag
        run: |
          python - <<'PY'
          import sys
          from signaal import pipeline, site
          blokkades = site.controleer_publicatiegereed(pipeline.laad_config("config.yaml"))
          for regel in blokkades:
              print(f"::error::{regel}")
          sys.exit(1 if blokkades else 0)
          PY

      - name: Archiveer de editie
        uses: actions/upload-artifact@v4
        with:
          name: editie-${{ github.run_id }}
          path: ai-bulletin/edities/
          retention-days: 90

      - name: Bewaar het archief in de repo
        run: |
          git config user.name "AI Bulletin"
          git config user.email "noreply@aibulletin.nl"
          git add edities
          git diff --cached --quiet && exit 0
          git commit -m "Editie van $(date -u +%F)"
          git push

      - name: Zet de site klaar voor Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai-bulletin/site

  publiceren:
    # Aparte job omdat Pages eigen rechten vereist die de editie-job niet nodig heeft.
    needs: editie
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
