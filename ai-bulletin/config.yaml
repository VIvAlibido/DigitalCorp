# AI Bulletin — configuratie
#
# Elke dag: verzamel kandidaten uit alle bronnen, ontdubbel, scoor,
# laat een LLM de 6 belangrijkste kiezen en in het Nederlands schrijven.

# Verzending. De laag zelf bestaat nog niet — zie plan/dagelijks-publiceren.md
# §3.2. Deze instellingen liggen vast zodat ze klaarstaan zodra die er is.
verzending:
  # Beslissing 23: de nieuwsbrief gaat via Substack, aibulletin.nl blijft het
  # archief. Reden: het aanbevelingsnetwerk levert volgens Substack zelf een
  # derde tot de helft van alle nieuwe abonnementen, en de Nederlandstalige
  # AI-lezers zitten daar al. Zie plan/groei.md §4.
  #
  # Vul hier de publicatie-URL in zodra hij bestaat, bijvoorbeeld
  # "https://aibulletin.substack.com". Het aanmeldformulier op de site stuurt
  # bezoekers dan naar <die URL>/subscribe met hun adres alvast ingevuld.
  # Zolang dit leeg is blokkeert site.controleer_publicatiegereed() de
  # publicatie: een aanmeldknop die nergens heen gaat is erger dan geen knop.
  substack: ""

  # Elke editie gaat altijd naar dit adres, ook vóór er abonnees zijn.
  # Vastgelegd door de opdrachtgever op 29 juli 2026.
  altijd_naar:
    - kees@telemedia.es
  # Waar de proefmail met de annuleerknop heen gaat (plan §4).
  proefmail: kees@telemedia.es
  # Lokale tijd waarop de campagne bij de ESP wordt ingepland.
  verzendtijd: "06:00"
  tijdzone: Europe/Amsterdam

# Wie de uitgever is. Verplicht voordat de site live mag.
#
# Art. 3:15d BW verplicht een commerciële website tot een vindbare naam,
# vestigingsadres, e-mailadres en KvK-nummer; een btw-nummer als je btw-plichtig
# bent. De AVG verplicht daarnaast tot een privacyverklaring die de
# verwerkingsverantwoordelijke noemt. Beide worden hieruit gegenereerd —
# colofon en privacypagina staan nergens los in HTML.
#
# Laat een veld nooit met een gok staan: site.controleer_publicatiegereed()
# blokkeert de publicatie zolang hier iets ontbreekt. Dat is met opzet.
uitgever:
  # Naam exact zoals hij in het register staat — anders is de uitgever daar niet
  # terug te vinden en heeft het nummer geen functie. Het register schrijft
  # "Digitalcorp OÜ" aan elkaar, niet "Digital Corp".
  naam: "Digitalcorp OÜ"
  handelsnaam: "AI Bulletin"
  # Het statutaire adres uit het Estse handelsregister. Hilversum
  # (Koninginneweg 11) is doorgegeven als werkadres maar staat niet als
  # vestiging in enig register; zie de open vraag in CLAUDE.md. Een adres
  # publiceren dat nergens is ingeschreven maakt de uitgever juist minder
  # vindbaar, dus tot dat is uitgezocht staat hier het geregistreerde adres.
  adres: "Tornimäe tn 5"
  postcode: "10145"
  plaats: "Tallinn"
  land: "Estland"
  register: "Estse handelsregister"
  # Registrikood, niet een KvK-nummer. Zie site._uitgever_regels().
  kvk: "16962575"
  # Het register meldt "VAT identification number: Missing" — dus leeg laten.
  # Een btw-nummer verzinnen of dat van een ander bedrijf lenen is erger dan geen.
  btw: ""
  email: "kees@telemedia.es"
  correcties: "kees@telemedia.es"
  telefoon: "+34 666 431 167"

output:
  # Hoogstens dit aantal berichten. Zijn er minder die de toets doorstaan, dan
  # wordt de editie korter — een zwak zesde bericht kost meer lezers dan een
  # korte editie. Zie rank.py.
  aantal_items: 6
  # De ondergrens. Stond op 3 en dwong daarmee opvulling af: op een dag met
  # één werkelijk bericht verbood onze eigen poort om dat ene bericht te
  # sturen. Eén bericht dat iets verandert verslaat vier die dat niet doen.
  # Nul blijft wél een storing — dan is er niet verzameld.
  minimaal_items: 1
  taal: nl
  # Waar de dagelijkse editie terechtkomt (relatief aan projectmap).
  map: edities

llm:
  model: claude-opus-5
  effort: high
  # Max tokens voor de rank+schrijf-stap. Denken telt hierin mee.
  max_tokens: 16000

# Hoeveel kandidaten gaan er naar de LLM-jury. Hoger = beter maar duurder.
shortlist: 40

# Alles ouder dan dit valt af (uren).
max_leeftijd_uren: 36

selectie:
  # Alleen voor de heuristische terugval: een item moet minstens deze fractie
  # van de hoogste voorscore van die dag halen. Schaalvrij, want de voorscore
  # zelf heeft geen betekenisvolle absolute schaal.
  min_verhouding: 0.35

# Geheugen tussen edities — voorkomt dat hetzelfde verhaal dagen achtereen
# terugkomt omdat verschillende media het op verschillende dagen oppikken.
historie:
  dagen: 30
  # Gelijkenis waarboven een kop als mogelijke herhaling geldt.
  drempel: 0.72
  # Vermenigvuldiger op de voorscore bij een mogelijke herhaling. Geen blokkade:
  # een vervolgstap in een lopend verhaal is legitiem nieuws.
  herhaalstraf: 0.45

scoring:
  # Gewicht per brontype in de voorselectie.
  brontype_gewicht:
    arxiv: 1.0
    github: 1.1
    huggingface: 0.9
    hackernews: 1.0
    rss: 0.8
    rss_nl: 1.4          # Nederlandstalige bronnen wegen zwaarder
  # Bonus als een item expliciet raakt aan de Nederlandse/EU-context.
  nl_relevantie_bonus: 2.5
  # Halveringstijd van de recency-score in uren.
  recency_halfwaardetijd_uren: 18

bronnen:
  arxiv:
    actief: true
    categorieen: [cs.AI, cs.LG, cs.CL, cs.CV]
    max: 60

  github:
    actief: true
    # Repos die in de laatste dagen zijn aangemaakt én snel sterren winnen.
    query: "created:>{sinds} stars:>25"
    max: 30

  huggingface:
    actief: true
    max: 25

  hackernews:
    actief: true
    min_punten: 60
    max: 30

  # Internationale bronnen.
  #
  # `sites` bevat websites, geen feed-URL's. De feed wordt opgezocht in de
  # <head> van de site zelf (zie bronnen/ontdek.py). Reden: op 31 juli kwamen
  # vier van de zes berichten van Tweakers omdat drie Nederlandse feeds
  # eerder waren uitgezet wegens 404 en er niets voor terugkwam — ik kon de
  # vervangende URL's hier niet controleren en heb toen niets gedaan. Raden
  # levert onzichtbare fouten op; de site vragen waar zijn feed staat niet.
  rss:
    actief: true
    sites:
      - https://openai.com
      - https://www.anthropic.com/news
      - https://deepmind.google/discover/blog
      - https://huggingface.co/blog
      - https://blog.google/technology/ai
      - https://mistral.ai/news
      - https://ai.meta.com/blog
      - https://simonwillison.net
      - https://www.interconnects.ai
      - https://jack-clark.net
      - https://www.technologyreview.com
      - https://arstechnica.com
      - https://techcrunch.com
      - https://venturebeat.com
      - https://digital-strategy.ec.europa.eu/en/news
    feeds:
      - https://engineering.fb.com/feed/

  # Nederlandstalige bronnen — dit is wat de kloon onderscheidt, en dit is
  # precies waar het op 31 juli misging: er waren er nog twee over.
  rss_nl:
    actief: true
    sites:
      - https://www.emerce.nl
      - https://www.computable.nl
      - https://www.agconnect.nl
      - https://www.techzine.nl
      - https://www.dutchitchannel.nl
      - https://www.nu.nl
      - https://nos.nl
      - https://www.bnr.nl
      - https://ibestuur.nl
      - https://www.binnenlandsbestuur.nl
      - https://mtsprout.nl
      - https://www.rijksoverheid.nl
      - https://autoriteitpersoonsgegevens.nl
      - https://www.acm.nl
    feeds:
      - https://tweakers.net/feeds/mixed.xml

  # Zie README: Instagram heeft geen officiële API voor accounts van derden.
  instagram:
    actief: false
    provider: null        # "apify" | "brightdata" | null
    accounts: []

# Termen die een item als relevant voor de Nederlandse markt markeren.
nl_signaalwoorden:
  - nederland
  - nederlandse
  - dutch
  - amsterdam
  - eindhoven
  - delft
  - asml
  - adyen
  - booking.com
  - picnic
  - nxp
  - tno
  - surf
  - cwi
  - "ai act"
  - "eu ai act"
  - avg
  - gdpr
  - "europese commissie"
  - "european commission"
  - eurhpc
  - mistral
  - aleph alpha
  - "digital services act"
  - autoriteit persoonsgegevens

audio:
  actief: false
  # "elevenlabs" | "azure" | "google"
  provider: elevenlabs
  stem: null
  # Nederlandse TTS: houd zinnen kort, spel afkortingen voluit.
  map: audio
